# SevaSignal local/EC2 demo with PostgreSQL.
# Run from the repository root: docker compose up -d --build
# Development mode permits HTTP demo login; AWS production needs HTTPS and RDS.
# The password below is for this demo database only.
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sevasignal
      POSTGRES_USER: sevasignal
      POSTGRES_PASSWORD: local_test_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sevasignal -d sevasignal"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "5000"
      DATABASE_MODE: postgres
      DATABASE_URL: postgresql://sevasignal:local_test_password@database:5432/sevasignal
      DATABASE_SSL: "false"
      TRUST_PROXY_HOPS: "1"
    depends_on:
      database:
        condition: service_healthy
    # Single-backend demo initialization. Use a coordinated migration step on AWS.
    command:
      - sh
      - -c
      - npm run db:migrate && npm run db:seed && exec node src/server.js
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  # Retained for the old embedded demo; its data is not migrated to PostgreSQL.
  sevasignal_data:
