# SevaSignal EC2 demo using embedded PGlite.
# Run from the repository root: docker compose up -d --build
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "5000"
      DATABASE_MODE: embedded
      EMBEDDED_DATA_DIR: .data/sevasignal
    volumes:
      - sevasignal_data:/app/.data
    command:
      - sh
      - -c
      - npm run db:migrate && npm run db:seed && exec node src/server.js
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:5000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sevasignal_data:
