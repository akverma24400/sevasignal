name: SevaSignal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker - ${{ matrix.service }}
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        service: [frontend, backend]

    env:
      IMAGE: akash24400/sevasignal-${{ matrix.service }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:latest" \
            "./${{ matrix.service }}"

      - name: Validate frontend Nginx configuration
        if: matrix.service == 'frontend'
        run: docker run --rm --entrypoint nginx "$IMAGE:$GITHUB_SHA" -t

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" |
            docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

      - name: Push Docker image
        if: env.PUBLISH == 'true'
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Log out
        if: always() && env.PUBLISH == 'true'
        run: docker logout